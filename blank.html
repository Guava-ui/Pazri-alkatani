<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Not Found</title>
    <link rel="shortcut icon" href="image/pp/favicon.ico" type="image/x-icon" />
  </head>
  <body>
    <style>
      :root {
        font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
        text-align: center;
        --neon: #08e6d6;
      }

      .head {
        text-align: center;
        font-family: sans-serif;
      }

      .head h1 {
        font-weight: 800;
      }

      .buttons {
        margin-top: 18px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .buttons a {
        text-decoration: none;
        color: var(--neon);
        font-family: sans-serif;
      }

      .btn {
        padding: 12px 24px;
        border-radius: 12px;
        font-weight: 600;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        background: rgba(5, 204, 240, 0.15); /* semi transparent glass */
        border: 1px solid rgba(123, 232, 247, 0.3);
        color: #ffffff;
        text-decoration: none;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
        transition: 0.25s ease;
      }

      .btn:hover {
        background: rgba(255, 255, 255, 0.25);
        box-shadow: 0 8px 40px rgba(0, 0, 0, 0.25);
        transform: translateY(-2px);
      }
    </style>
    <nav>
      <div class="head">
        <h1>404 - Not Found</h1>
        <p>
          Mohon bersabar ya Produk belum tersedia dikarenakan admin sedang Galau
          Brutal
        </p>
      </div>

      <div class="buttons">
        <a class="btn btn-primary" href="/index.html"
          >Kamu Pasti Balik lagi kan? kan? :)</a
        >
      </div>
    </nav>
  </body>
</html>
